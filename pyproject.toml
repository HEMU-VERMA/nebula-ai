[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nebula-ai"
version = "0.1.0"
description = "A reproducible framework for evolving software with AI-guided mutations and measurable fitness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "HEMU-VERMA" }]
keywords = ["ai", "evolution", "optimization", "agents", "benchmarking", "program-synthesis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["mypy>=2.3.1", "pytest>=8.3", "pytest-cov>=6", "ruff>=0.11", "build>=1.2"]

[project.scripts]
nebula = "nebula.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nebula"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["nebula"]
strict = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
